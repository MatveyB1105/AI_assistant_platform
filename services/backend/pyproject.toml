[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.*",
    "uvicorn[standard]==0.32.*",
    "pydantic==2.9.*",
    "pydantic-settings==2.6.*",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.*",
    "alembic==1.14.*",
    "pyjwt==2.10.*",
    "bcrypt==4.2.*",
    "httpx==0.27.*",
    "python-multipart==0.0.17",   # нужен для /upload
]

[dependency-groups]
dev = ["pytest==8.3.*", "pytest-asyncio==0.24.*", "ruff==0.8.*"]